name: Check and optionally deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  PAGES_DEPLOY_ENABLED: "true"
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_deploy_enabled: ${{ steps.deployment-mode.outputs.enabled }}
    steps:
      - name: Read deployment switch
        id: deployment-mode
        run: echo "enabled=$PAGES_DEPLOY_ENABLED" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - uses: actions/configure-pages@v5
        if: env.PAGES_DEPLOY_ENABLED == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: env.PAGES_DEPLOY_ENABLED == 'true'
        with:
          path: dist
  deploy:
    needs: build
    if: needs.build.outputs.pages_deploy_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
